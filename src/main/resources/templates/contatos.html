<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">📒 Contatos</span>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/contatos}">Todos</a>
            <a class="nav-link" th:href="@{/favoritos}">⭐ Favoritos</a>
            <span class="nav-link text-white-50" th:text="${usuario.nome}"></span>
            <a class="nav-link text-warning" th:href="@{/logout}">Sair</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="card shadow">
        <div class="card-header">
            <h5 class="mb-0">Lista de Contatos</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Endereço</th>
                    <th>Nascimento</th>
                    <th class="text-center">Favorito</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contato : ${contatos}">
                    <td th:text="${contato.id}"></td>
                    <td th:text="${contato.nome}"></td>
                    <td th:text="${contato.telefone}"></td>
                    <td th:text="${contato.email}"></td>
                    <td th:text="${contato.endereco}"></td>
                    <td th:text="${contato.dataNascimento}"></td>
                    <td class="text-center">
                        <!-- ⭐ se favoritado / ☆ se não -->
                        <span class="text-warning" th:if="${favoritos.contains(contato.id)}">⭐ Favoritado</span>
                        <span th:unless="${favoritos.contains(contato.id)}">☆</span>
                        <form th:action="@{/contatos/{id}/favoritar(id=${contato.id})}" method="post" class="d-inline">
                            <button type="submit"
                                    th:class="${favoritos.contains(contato.id)} ? 'btn btn-sm btn-warning' : 'btn btn-sm btn-outline-secondary'"
                                    th:text="${favoritos.contains(contato.id)} ? 'Remover ⭐' : 'Favoritar ☆'"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(contatos)}">
                    <td colspan="7" class="text-center text-muted py-4">Nenhum contato cadastrado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
