<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Favoritos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">Contatos</span>
        <div class="navbar-nav d-flex flex-row gap-3">
            <a class="nav-link" th:href="@{/contatos}">Todos</a>
            <a class="nav-link active" th:href="@{/favoritos}">Favoritos</a>
            <span class="navbar-text" th:text="${usuario.nome}"></span>
            <a class="nav-link" th:href="@{/logout}">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <table class="table table-striped align-middle bg-white">
        <thead>
        <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Endereço</th>
            <th>Nascimento</th>
            <th>Ação</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contato : ${contatos}">
            <td th:text="${contato.id}"></td>
            <td th:text="${contato.nome}"></td>
            <td th:text="${contato.telefone}"></td>
            <td th:text="${contato.email}"></td>
            <td th:text="${contato.endereco}"></td>
            <td th:text="${contato.dataNascimento}"></td>
            <td>
                <form th:action="@{/contatos/{id}/favoritar(id=${contato.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-warning">Remover</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(contatos)}">
            <td colspan="7" class="text-center text-muted">Nenhum favorito cadastrado.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
